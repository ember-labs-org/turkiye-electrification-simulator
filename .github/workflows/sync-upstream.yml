# .github/workflows/sync-upstream.yml (in the Labs fork)
name: Sync from Bahadir's version
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:      # also allows a manual run
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch upstream and open a PR if there are changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/bsgumus/elektrifikasyon.git
          git fetch upstream main
          if [ -z "$(git log --oneline HEAD..upstream/main)" ]; then
            echo "No new changes"; exit 0
          fi
          git checkout -B upstream-sync upstream/main
          git push -f origin upstream-sync
          gh pr list --head upstream-sync --state open --json number --jq 'length' | grep -q '^0$' && \
            gh pr create --head upstream-sync --base main \
              --title "Updates from Bahadir's version" \
              --body "Weekly check found new changes in the original repo. Review before merging: keep Labs branding, footer and disclaimer." \
            || echo "PR already open"
